name: Validate

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tooling/docusaurus-renderer/requirements.txt

      - name: Render Foundation
        run: |
          python tooling/docusaurus-renderer/render.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: book/package-lock.json

      - name: Install dependencies
        working-directory: book
        run: npm ci

      - name: Build documentation
        working-directory: book
        run: npm run build
